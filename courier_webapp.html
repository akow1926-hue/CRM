<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cosmo CRM — WebApp Курьера</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #070c18;
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-border: rgba(59, 130, 246, 0.25);
      --accent-yellow: #facc15;
      --accent-yellow-dark: #eab308;
      --accent-blue: #3b82f6;
      --accent-blue-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-color);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(250, 204, 21, 0.12) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 80px;
    }

    /* AUTH OVERLAY */
    .auth-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #070c18;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-top: 4px solid var(--accent-yellow);
      border-radius: 24px;
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    .auth-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .form-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input, .form-select {
      width: 100%;
      background: rgba(30, 41, 59, 0.7);
      border: 1.5px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 14px 16px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      outline: none;
      transition: all 0.2s;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--accent-yellow);
      box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.2);
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-yellow) 0%, var(--accent-yellow-dark) 100%);
      color: #070c18;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(250, 204, 21, 0.3);
      margin-top: 8px;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* HEADER */
    .app-header {
      padding: 16px 20px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-yellow) 0%, var(--accent-blue) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #070c18;
      font-size: 16px;
    }

    .user-info h3 {
      font-size: 15px;
      font-weight: 800;
    }

    .user-info p {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* TABS */
    .tabs-nav {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px;
      margin: 14px 16px 8px 16px;
      border-radius: 14px;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      background: transparent;
      border: none;
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--accent-blue);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    /* MAIN CONTAINER */
    .content-area {
      padding: 12px 16px;
      flex: 1;
    }

    .order-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--accent-yellow);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
    }

    .order-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .order-badge {
      background: linear-gradient(135deg, var(--accent-yellow) 0%, var(--accent-yellow-dark) 100%);
      color: #070c18;
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
    }

    .order-status {
      font-size: 11px;
      font-weight: 700;
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.2);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .client-name {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .client-phone {
      font-size: 14px;
      color: var(--accent-yellow);
      font-weight: 700;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 8px;
    }

    .order-addr {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .order-comment {
      background: rgba(250, 204, 21, 0.12);
      border: 1px solid rgba(250, 204, 21, 0.3);
      color: #fef08a;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-row {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      flex: 1;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid var(--accent-blue);
      color: #ffffff;
      padding: 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .btn-nav {
      background: rgba(250, 204, 21, 0.15);
      border: 1px solid var(--accent-yellow);
      color: var(--accent-yellow);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .empty-msg {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- AUTH OVERLAY -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
      <div class="auth-title">Cosmo CRM 🚚</div>
      <div class="auth-subtitle">Вход для Курьера</div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Логин Курьера</label>
          <input type="text" id="loginUser" class="form-input" placeholder="например: akobir" required>
        </div>
        <div class="form-group">
          <label class="form-label">Пароль</label>
          <input type="password" id="loginPass" class="form-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary">🔑 Войти в WebApp</button>
      </form>
    </div>
  </div>

  <!-- HEADER -->
  <div class="app-header">
    <div class="header-user">
      <div id="userAvatar" class="user-avatar">K</div>
      <div class="user-info">
        <h3 id="userName">Курьер</h3>
        <p>Cosmo CRM 🚚</p>
      </div>
    </div>
    <button onclick="logout()" class="btn-logout">🚪 Выйти</button>
  </div>

  <!-- TABS -->
  <div class="tabs-nav">
    <button class="tab-btn active" onclick="switchTab('pickup', event)">📥 Забор (<span id="pickupCount">0</span>)</button>
    <button class="tab-btn" onclick="switchTab('delivery', event)">🚚 Доставка (<span id="deliveryCount">0</span>)</button>
    <button class="tab-btn" onclick="switchTab('new', event)">➕ Новый</button>
    <button class="tab-btn" onclick="switchTab('calc', event)">📏 Замер</button>
  </div>

  <!-- CONTENT AREA -->
  <div class="content-area">

    <!-- TAB 1: PICKUP -->
    <div id="tabPickup" class="tab-content">
      <div id="pickupList"></div>
    </div>

    <!-- TAB 2: DELIVERY -->
    <div id="tabDelivery" class="tab-content" style="display:none;">
      <div id="deliveryList"></div>
    </div>

    <!-- TAB 3: NEW ORDER -->
    <div id="tabNew" class="tab-content" style="display:none;">
      <div class="order-card">
        <h3 style="font-size: 16px; font-weight: 800; color: var(--accent-yellow); margin-bottom: 14px;">➕ Добавить заказ при заборе</h3>
        <form onsubmit="handleCreateOrder(event)">
          <div class="form-group">
            <label class="form-label">👤 ФИО Клиента *</label>
            <input type="text" id="newClient" class="form-input" placeholder="Алишер Назаров" required>
          </div>
          <div class="form-group">
            <label class="form-label">📞 Телефон (9 цифр) *</label>
            <input type="tel" id="newPhone" class="form-input" placeholder="901234567" required>
          </div>
          <div class="form-group">
            <label class="form-label">🏠 Район *</label>
            <select id="newDistrict" class="form-select">
              <option value="Сиёб (Siyob)">Сиёб (Siyob)</option>
              <option value="Багишамальский">Багишамальский</option>
              <option value="Согдиана">Согдиана</option>
              <option value="Микрорайон">Микрорайон</option>
              <option value="Саттепо">Саттепо</option>
              <option value="Железнодорожный">Железнодорожный</option>
              <option value="Самаркандский р-н">Самаркандский р-н</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">🏠 Точный адрес *</label>
            <input type="text" id="newAddress" class="form-input" placeholder="ул. Навои 12, кв 4" required>
          </div>
          <div class="form-group">
            <label class="form-label">🧺 Комментарий / Описание ковров</label>
            <input type="text" id="newItems" class="form-input" placeholder="Забор 2 ковров">
          </div>
          <button type="submit" class="btn-primary">🚀 Создать заказ</button>
        </form>
      </div>
    </div>

    <!-- TAB 4: CALCULATOR -->
    <div id="tabCalc" class="tab-content" style="display:none;">
      <div class="order-card">
        <h3 style="font-size: 16px; font-weight: 800; color: var(--accent-yellow); margin-bottom: 14px;">📏 Калькулятор замера ковров</h3>
        <div class="form-group">
          <label class="form-label">№ Заказа</label>
          <input type="text" id="calcOrderId" class="form-input" placeholder="Введите ID заказа">
        </div>
        <div style="display: flex; gap: 10px;">
          <div class="form-group" style="flex: 1;">
            <label class="form-label">Ширина (м)</label>
            <input type="number" step="0.01" id="calcW" class="form-input" placeholder="2.5" oninput="recalcSum()">
          </div>
          <div class="form-group" style="flex: 1;">
            <label class="form-label">Длина (м)</label>
            <input type="number" step="0.01" id="calcL" class="form-input" placeholder="3.0" oninput="recalcSum()">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Цена за кв.м (сум)</label>
          <input type="number" id="calcPrice" class="form-input" value="20000" oninput="recalcSum()">
        </div>
        <div style="background: rgba(30, 41, 59, 0.7); border-radius: 12px; padding: 14px; margin-bottom: 16px; text-align: center;">
          <div style="font-size: 12px; color: var(--text-muted);">Итоговая площадь: <b id="resArea" style="color:white;">0 кв.м</b></div>
          <div style="font-size: 18px; font-weight: 800; color: var(--accent-yellow); margin-top: 4px;">💰 <span id="resTotal">0</span> сум</div>
        </div>
        <button type="button" onclick="saveCalcResult()" class="btn-primary">💾 Сохранить результат замера</button>
      </div>
    </div>

  </div>

  <script>
    let tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    let currentUser = null;
    let ordersData = [];

    window.onload = function() {
      const saved = localStorage.getItem('cosmo_courier_user');
      if (saved) {
        try {
          currentUser = JSON.parse(saved);
          showUserApp();
        } catch (e) {
          document.getElementById('authOverlay').style.display = 'flex';
        }
      } else {
        document.getElementById('authOverlay').style.display = 'flex';
      }
    };

    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('loginUser').value.trim();
      currentUser = { username: u, role: 'Courier' };
      localStorage.setItem('cosmo_courier_user', JSON.stringify(currentUser));
      showUserApp();
    }

    function showUserApp() {
      document.getElementById('authOverlay').style.display = 'none';
      const uName = currentUser?.username || 'Курьер';
      document.getElementById('userName').innerText = uName;
      document.getElementById('userAvatar').innerText = uName.charAt(0).toUpperCase();
      loadOrders();
    }

    function logout() {
      localStorage.removeItem('cosmo_courier_user');
      currentUser = null;
      document.getElementById('authOverlay').style.display = 'flex';
    }

    function switchTab(tabName, evt) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');

      if (tabName === 'pickup') document.getElementById('tabPickup').style.display = 'block';
      else if (tabName === 'delivery') document.getElementById('tabDelivery').style.display = 'block';
      else if (tabName === 'new') document.getElementById('tabNew').style.display = 'block';
      else if (tabName === 'calc') document.getElementById('tabCalc').style.display = 'block';

      if (evt && evt.target) evt.target.classList.add('active');
    }

    function getApiUrl(path) {
      let base = window.serverApiUrl || '';
      if (!base) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          base = 'http://' + window.location.hostname + ':8080';
        } else {
          base = '';
        }
      }
      return base ? (base.replace(/\/$/, '') + path) : path;
    }

    async function loadOrders() {
      try {
        const res = await fetch(getApiUrl('/api/orders?_t=' + Date.now()));
        if (res.ok) {
          const remoteData = await res.json();
          if (Array.isArray(remoteData)) {
            ordersData = remoteData;
            localStorage.setItem('cosmo_orders_data', JSON.stringify(ordersData));
            renderOrders();
            return;
          }
        }
      } catch (e) {
        console.warn('API fetch warning:', e);
      }

      const cached = localStorage.getItem('cosmo_orders_data');
      if (cached) {
        try { ordersData = JSON.parse(cached); } catch (e) {}
      } else if (window.initialOrders && Array.isArray(window.initialOrders)) {
        ordersData = window.initialOrders;
      }
      renderOrders();
    }

    function getNavUrls(loc, address, district) {
      let lat = null, lng = null;
      if (loc && typeof loc === 'string') {
        let matches = loc.match(/([0-9]+\.[0-9]+)/g);
        if (matches && matches.length >= 2) {
          let n1 = parseFloat(matches[0]), n2 = parseFloat(matches[1]);
          if (n1 >= 30 && n1 <= 45 && n2 >= 60 && n2 <= 75) { lat = n1; lng = n2; }
          else if (n2 >= 30 && n2 <= 45 && n1 >= 60 && n1 <= 75) { lat = n2; lng = n1; }
        }
      }
      if (lat && lng) {
        return {
          navi: `yandexnavi://build_route_on_map?lat_to=${lat}&lon_to=${lng}`,
          ymaps: `https://yandex.ru/maps/?rtext=~${lat},${lng}&rtt=auto`,
          gmaps: `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`,
          isExact: true
        };
      }
      const full = `Самарканд ${district || ''} ${address || ''}`.trim();
      const enc = encodeURIComponent(full);
      return {
        navi: `yandexnavi://build_route_on_map?lat_to=&lon_to=&text=${enc}`,
        ymaps: `https://yandex.ru/maps/?text=${enc}`,
        gmaps: `https://www.google.com/maps/search/?api=1&query=${enc}`,
        isExact: false
      };
    }

    function sendGPSForOrder(orderId) {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {
          const lat = pos.coords.latitude.toFixed(6);
          const lng = pos.coords.longitude.toFixed(6);
          const locStr = `${lat}, ${lng}`;

          ordersData.forEach(o => {
            if (String(o.ID) === String(orderId)) {
              o.Локация = locStr;
            }
          });
          localStorage.setItem('cosmo_orders_data', JSON.stringify(ordersData));
          renderOrders();
          alert(`📍 GPS координаты (${locStr}) успешно привязаны к Заказу №${orderId}!`);

          fetch(getApiUrl('/api/orders/update_location'), {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ orderId: orderId, lat: lat, lng: lng })
          }).catch(err => {});
        }, function(err) {
          alert('⚠️ Ошибка GPS: ' + err.message);
        }, { enableHighAccuracy: true });
      } else {
        alert('⚠️ Геолокация не поддерживается вашим устройством');
      }
    }

    function renderOrders() {
      const pickupEl = document.getElementById('pickupList');
      const deliveryEl = document.getElementById('deliveryList');

      const pickupOrders = ordersData.filter(o => {
        const st = (o.Статус || '').toLowerCase();
        return st.includes('забор') || st.includes('ожид') || st.includes('нов');
      });

      const deliveryOrders = ordersData.filter(o => {
        const st = (o.Статус || '').toLowerCase();
        return st.includes('готов') || st.includes('достав');
      });

      document.getElementById('pickupCount').innerText = pickupOrders.length;
      document.getElementById('deliveryCount').innerText = deliveryOrders.length;

      // Pickup List
      if (pickupOrders.length === 0) {
        pickupEl.innerHTML = '<div class="empty-msg">📭 Нет новых заявок на забор ковров</div>';
      } else {
        pickupEl.innerHTML = pickupOrders.map(o => {
          const nav = getNavUrls(o.Локация, o.Адрес, o.Район);
          const comment = o.Размеры || o.Примечание || o.Izoh || 'Заказ на забор';
          return `
          <div class="order-card">
            <div class="order-header">
              <span class="order-badge">📦 № ${o.ID}</span>
              <span class="order-status">${o.Статус || 'Забор'}</span>
            </div>
            <div class="client-name">👤 ${o.Клиент || 'Клиент'}</div>
            <a href="tel:${o.Телефон}" class="client-phone">📞 ${o.Телефон || '-'}</a>
            <div class="order-addr">🏠 <b>${o.Район || 'Самарканд'}</b>, ${o.Адрес || '-'}</div>
            
            <!-- КОММЕНТАРИЙ ДЛЯ КУРЬЕРА -->
            <div class="order-comment">
              💬 <b>Комментарий:</b> ${comment}
              ${nav.isExact ? '<span style="color:#10b981; font-weight:bold;"><br>📍 (GPS координаты сохранены)</span>' : ''}
            </div>

            <div class="card-actions">
              <div style="display:flex; gap:6px; margin-bottom:8px;">
                <a href="${nav.navi}" class="btn-nav" style="flex:1;">🧭 Навигатор</a>
                <a href="${nav.ymaps}" target="_blank" class="btn-nav" style="flex:1; background:#3b82f6;">🗺️ Я.Карты</a>
              </div>
              <button onclick="sendGPSForOrder('${o.ID}')" class="btn-action" style="width:100%; margin-bottom:8px; background:rgba(16, 185, 129, 0.2); border-color:#10b981; color:#10b981;">📍 Передать мои GPS координаты</button>
              <div class="action-row">
                <button onclick="updateStatus('${o.ID}', 'В цеху')" class="btn-action">🚗 Забрал (В цех)</button>
                <button onclick="openCalcFor('${o.ID}')" class="btn-action" style="background: rgba(250, 204, 21, 0.2); border-color: #facc15; color: #facc15;">📏 Замерить</button>
              </div>
            </div>
          </div>
        `;}).join('');
      }

      // Delivery List
      if (deliveryOrders.length === 0) {
        deliveryEl.innerHTML = '<div class="empty-msg">📭 Нет готовых заказов на доставку</div>';
      } else {
        deliveryEl.innerHTML = deliveryOrders.map(o => {
          const nav = getNavUrls(o.Локация, o.Адрес, o.Район);
          const comment = o.Размеры || o.Примечание || o.Izoh || 'Доставка';
          return `
          <div class="order-card" style="border-left-color: #3b82f6;">
            <div class="order-header">
              <span class="order-badge" style="background: #3b82f6; color: white;">🚚 № ${o.ID}</span>
              <span class="order-status">${o.Статус || 'Готов'}</span>
            </div>
            <div class="client-name">👤 ${o.Клиент || 'Клиент'}</div>
            <a href="tel:${o.Телефон}" class="client-phone">📞 ${o.Телефон || '-'}</a>
            <div class="order-addr">🏠 <b>${o.Район || 'Самарканд'}</b>, ${o.Адрес || '-'}</div>
            
            <div class="order-comment">
              💬 <b>Комментарий:</b> ${comment}
              ${nav.isExact ? '<span style="color:#10b981; font-weight:bold;"><br>📍 (GPS координаты сохранены)</span>' : ''}
            </div>

            <div style="font-size: 15px; font-weight: 800; color: #facc15; margin-bottom: 10px;">💰 К оплате: ${(o.Сумма || 0).toLocaleString()} сум</div>
            <div class="card-actions">
              <div style="display:flex; gap:6px; margin-bottom:8px;">
                <a href="${nav.navi}" class="btn-nav" style="flex:1;">🧭 Навигатор</a>
                <a href="${nav.ymaps}" target="_blank" class="btn-nav" style="flex:1; background:#3b82f6;">🗺️ Я.Карты</a>
              </div>
              <button onclick="sendGPSForOrder('${o.ID}')" class="btn-action" style="width:100%; margin-bottom:8px; background:rgba(16, 185, 129, 0.2); border-color:#10b981; color:#10b981;">📍 Передать мои GPS координаты</button>
              <div class="action-row">
                <button onclick="completePayment('${o.ID}', 'Наличные')" class="btn-action">💵 Наличные</button>
                <button onclick="completePayment('${o.ID}', 'Карта/Click')" class="btn-action" style="background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; color: #60a5fa;">💳 Карта</button>
              </div>
            </div>
          </div>
        `;}).join('');
      }
    }

    function updateStatus(orderId, newStatus) {
      ordersData.forEach(o => {
        if (String(o.ID) === String(orderId)) o.Статус = newStatus;
      });
      localStorage.setItem('cosmo_orders_data', JSON.stringify(ordersData));
      renderOrders();
      alert(`✅ Заказ №${orderId} переведен в статус: ${newStatus}`);

      fetch(getApiUrl('/api/orders/update_status'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId, status: newStatus, courier: currentUser?.username })
      }).catch(e => {});
    }

    function completePayment(orderId, payType) {
      ordersData.forEach(o => {
        if (String(o.ID) === String(orderId)) {
          o.Статус = 'Выполнен';
          o['Тип оплаты'] = payType;
        }
      });
      localStorage.setItem('cosmo_orders_data', JSON.stringify(ordersData));
      renderOrders();
      alert(`🎉 Заказ №${orderId} выполнен! Оплата принята (${payType}).`);

      fetch(getApiUrl('/api/orders/update_status'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId, status: 'Выполнен', payType, courier: currentUser?.username })
      }).catch(e => {});
    }

    function openCalcFor(orderId) {
      document.getElementById('calcOrderId').value = orderId;
      switchTab('calc');
    }

    function recalcSum() {
      const w = parseFloat(document.getElementById('calcW').value) || 0;
      const l = parseFloat(document.getElementById('calcL').value) || 0;
      const p = parseFloat(document.getElementById('calcPrice').value) || 20000;
      const area = Math.round(w * l * 100) / 100;
      const total = Math.round(area * p);
      document.getElementById('resArea').innerText = `${area} кв.м`;
      document.getElementById('resTotal').innerText = total.toLocaleString();
    }

    async function saveCalcResult() {
      const orderId = document.getElementById('calcOrderId').value;
      const w = parseFloat(document.getElementById('calcW').value) || 0;
      const l = parseFloat(document.getElementById('calcL').value) || 0;
      const p = parseFloat(document.getElementById('calcPrice').value) || 20000;
      const area = Math.round(w * l * 100) / 100;
      const total = Math.round(area * p);

      if (!orderId) {
        alert('⚠️ Укажите ID заказа!');
        return;
      }

      ordersData.forEach(o => {
        if (String(o.ID) === String(orderId)) {
          o['Площадь'] = String(area);
          o['Сумма'] = String(total);
          o['Размеры'] = `Ковёр: ${w}x${l}м (${area} кв.м)`;
        }
      });
      localStorage.setItem('cosmo_orders_data', JSON.stringify(ordersData));
      renderOrders();
      alert(`✅ Замер для Заказа №${orderId} сохранен (${area} кв.м, ${total.toLocaleString()} сум)!`);
      switchTab('pickup');

      fetch(getApiUrl('/api/orders/measure'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId, width: w, length: l, price: p })
      }).catch(e => {});
    }

    function handleCreateOrder(e) {
      e.preventDefault();
      const client = document.getElementById('newClient').value.trim();
      const phone = document.getElementById('newPhone').value.trim();
      const district = document.getElementById('newDistrict').value;
      const address = document.getElementById('newAddress').value.trim();
      const items = document.getElementById('newItems').value.trim() || 'Забор ковров';

      const tempId = 'TG-' + (Math.floor(Math.random() * 9000) + 1000);
      const newOrder = {
        ID: tempId,
        Дата: new Date().toLocaleString('ru-RU'),
        Клиент: client,
        Телефон: phone,
        Район: district,
        Адрес: address,
        Размеры: items,
        Статус: 'Ожидает забора',
        Курьер: currentUser?.username || 'Курьер'
      };

      ordersData.unshift(newOrder);
      localStorage.setItem('cosmo_orders_data', JSON.stringify(ordersData));
      renderOrders();
      alert(`🎉 Заказ №${tempId} успешно создан!`);
      document.getElementById('newClient').value = '';
      document.getElementById('newPhone').value = '';
      document.getElementById('newAddress').value = '';
      document.getElementById('newItems').value = '';
      switchTab('pickup');

      fetch(getApiUrl('/api/orders/create'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ client, phone, district, address, items, courier: currentUser?.username || 'Курьер' })
      }).catch(err => {});
    }

    // Auto-polling for order updates every 10 seconds
    setInterval(loadOrders, 10000);
  </script>
</body>
</html>
