services:
  # 1. Streamlit CRM Dashboard
  - type: web
    name: crm-dashboard
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # 2. Telegram Bots & Courier WebApp
  - type: web
    name: crm-telegram-bots
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_bots.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
