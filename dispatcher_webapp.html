<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cosmo CRM — WebApp Диспетчера</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #070c18;
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-border: rgba(59, 130, 246, 0.25);
      --accent-yellow: #facc15;
      --accent-yellow-dark: #eab308;
      --accent-blue: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-color);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(250, 204, 21, 0.12) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 30px;
    }

    /* AUTH OVERLAY */
    .auth-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #070c18;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-top: 4px solid var(--accent-yellow);
      border-radius: 24px;
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    .auth-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .form-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      background: rgba(30, 41, 59, 0.7);
      border: 1.5px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      transition: all 0.2s;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--accent-yellow);
      box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.2);
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-yellow) 0%, var(--accent-yellow-dark) 100%);
      color: #070c18;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(250, 204, 21, 0.3);
      margin-top: 8px;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* HEADER */
    .app-header {
      padding: 14px 18px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-yellow) 0%, var(--accent-blue) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #070c18;
      font-size: 15px;
    }

    .user-info h3 {
      font-size: 14px;
      font-weight: 800;
    }

    .user-info p {
      font-size: 11px;
      color: var(--accent-yellow);
      font-weight: 600;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    /* TABS */
    .tabs-nav {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px;
      margin: 12px 14px 8px 14px;
      border-radius: 14px;
      border: 1px solid rgba(59, 130, 246, 0.2);
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 4px;
      background: transparent;
      border: none;
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--accent-blue);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    /* CONTENT AREA */
    .content-area {
      padding: 10px 14px;
      flex: 1;
    }

    .order-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--accent-yellow);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
    }

    .order-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .order-badge {
      background: linear-gradient(135deg, var(--accent-yellow) 0%, var(--accent-yellow-dark) 100%);
      color: #070c18;
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
    }

    .order-status {
      font-size: 11px;
      font-weight: 700;
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.2);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .client-name {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .client-phone {
      font-size: 14px;
      color: var(--accent-yellow);
      font-weight: 700;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 6px;
    }

    .order-addr {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .order-comment {
      background: rgba(250, 204, 21, 0.12);
      border: 1px solid rgba(250, 204, 21, 0.3);
      color: #fef08a;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .btn-nav {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
      display: block;
    }

    .empty-msg {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- AUTH OVERLAY -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
      <div class="auth-title">Cosmo CRM 🎧</div>
      <div class="auth-subtitle">Панель Диспетчера</div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Логин Диспетчера</label>
          <input type="text" id="loginUser" class="form-input" placeholder="например: admin" required>
        </div>
        <div class="form-group">
          <label class="form-label">Пароль</label>
          <input type="password" id="loginPass" class="form-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary">🔑 Войти в систему</button>
      </form>
    </div>
  </div>

  <!-- HEADER -->
  <div class="app-header">
    <div class="header-user">
      <div id="userAvatar" class="user-avatar">D</div>
      <div class="user-info">
        <h3 id="userName">Диспетчер</h3>
        <p>Cosmo CRM 🎧</p>
      </div>
    </div>
    <button onclick="logout()" class="btn-logout">🚪 Выйти</button>
  </div>

  <!-- 3 SIMPLE TABS ONLY -->
  <div class="tabs-nav">
    <button class="tab-btn active" onclick="switchTab('new', event)">📥 Принять заказ</button>
    <button class="tab-btn" onclick="switchTab('orders', event)">📋 Заказы</button>
    <button class="tab-btn" onclick="switchTab('msg', event)">💬 Написать курьерам</button>
  </div>

  <!-- CONTENT -->
  <div class="content-area">

    <!-- TAB 1: ПРИНЯТЬ ЗАКАЗ ОТ КЛИЕНТА -->
    <div id="tabNew" class="tab-content">
      <div class="order-card">
        <h3 style="font-size: 16px; font-weight: 800; color: var(--accent-yellow); margin-bottom: 14px;">📥 Принять заказ от клиента</h3>
        <form onsubmit="handleCreateOrder(event)">
          
          <div class="form-group">
            <label class="form-label">👤 ФИО Клиента *</label>
            <input type="text" id="newClient" class="form-input" placeholder="Алишер Назаров" required>
          </div>

          <div class="form-group">
            <label class="form-label">📞 Телефон (9 цифр) *</label>
            <input type="tel" id="newPhone" class="form-input" placeholder="901234567" max_chars="9" required>
          </div>

          <div class="form-group">
            <label class="form-label">🏠 Район *</label>
            <select id="newDistrict" class="form-select">
              <option value="Сиёб (Siyob)">Сиёб (Siyob)</option>
              <option value="Багишамальский">Багишамальский</option>
              <option value="Согдиана">Согдиана</option>
              <option value="Микрорайон">Микрорайон</option>
              <option value="Саттепо">Саттепо</option>
              <option value="Железнодорожный">Железнодорожный</option>
              <option value="Самаркандский р-н">Самаркандский р-н</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">🏠 Точный адрес *</label>
            <input type="text" id="newAddress" class="form-input" placeholder="ул. Навои 12, кв 4" required>
          </div>

          <div class="form-group">
            <label class="form-label">🚚 Назначить курьера *</label>
            <select id="newCourier" class="form-select">
              <option value="Алишер Каримов">Алишер Каримов</option>
              <option value="Бобур Ибрагимов">Бобур Ибрагимов</option>
              <option value="Сардор Турсунов">Сардор Турсунов</option>
              <option value="Firuz">Firuz</option>
              <option value="Nazarov01">Nazarov01</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">📝 Комментарий для курьеров (ориентир / время / примечания)</label>
            <textarea id="newComment" class="form-textarea" rows="3" placeholder="Например: Забор 3 ковров. Звонить за 15 минут. Ориентир: возле аптеки."></textarea>
          </div>

          <button type="submit" class="btn-primary">🚀 Принять заказ</button>
        </form>
      </div>
    </div>

    <!-- TAB 2: СПИСОК ВСЕХ ЗАКАЗОВ С КОММЕНТАРИЯМИ -->
    <div id="tabOrders" class="tab-content" style="display:none;">
      <div style="margin-bottom: 12px;">
        <input type="text" id="searchQuery" class="form-input" placeholder="🔍 Поиск по имени, номеру или ID..." oninput="renderOrders()">
      </div>
      <div id="ordersList"></div>
    </div>

    <!-- TAB 3: НАПИСАТЬ КУРЬЕРАМ -->
    <div id="tabMsg" class="tab-content" style="display:none;">
      <div class="order-card">
        <h3 style="font-size: 16px; font-weight: 800; color: var(--accent-yellow); margin-bottom: 14px;">💬 Написать курьеру в Telegram</h3>
        <form onsubmit="handleSendBroadcast(event)">
          <div class="form-group">
            <label class="form-label">🚚 Выберите курьера</label>
            <select id="msgCourierTarget" class="form-select">
              <option value="all">📢 ВСЕМ КУРЬЕРАМ (Рассылка)</option>
              <option value="Алишер Каримов">Алишер Каримов</option>
              <option value="Бобур Ибрагимов">Бобур Ибрагимов</option>
              <option value="Сардор Турсунов">Сардор Турсунов</option>
              <option value="Firuz">Firuz</option>
              <option value="Nazarov01">Nazarov01</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">💬 Текст сообщения *</label>
            <textarea id="msgText" class="form-textarea" rows="4" placeholder="Введите сообщение для курьера..." required></textarea>
          </div>
          <button type="submit" class="btn-primary" style="background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%); color: white;">📢 Отправить сообщение курьеру</button>
        </form>
      </div>
    </div>

  </div>

  <script>
    let tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    let currentUser = null;
    let ordersData = [];
    const courierOptions = ["Алишер Каримов", "Бобур Ибрагимов", "Сардор Турсунов", "Firuz", "Nazarov01"];

    window.onload = function() {
      const saved = localStorage.getItem('cosmo_disp_user');
      if (saved) {
        try {
          currentUser = JSON.parse(saved);
          showUserApp();
        } catch (e) {
          document.getElementById('authOverlay').style.display = 'flex';
        }
      } else {
        document.getElementById('authOverlay').style.display = 'flex';
      }
    };

    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('loginUser').value.trim();
      currentUser = { username: u, role: 'Dispatcher' };
      localStorage.setItem('cosmo_disp_user', JSON.stringify(currentUser));
      showUserApp();
    }

    function showUserApp() {
      document.getElementById('authOverlay').style.display = 'none';
      const uName = currentUser.username || 'Диспетчер';
      document.getElementById('userName').innerText = uName;
      document.getElementById('userAvatar').innerText = uName.charAt(0).toUpperCase();
      loadOrders();
    }

    function logout() {
      localStorage.removeItem('cosmo_disp_user');
      currentUser = null;
      document.getElementById('authOverlay').style.display = 'flex';
    }

    function switchTab(tabName, evt) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');

      if (tabName === 'new') document.getElementById('tabNew').style.display = 'block';
      else if (tabName === 'orders') document.getElementById('tabOrders').style.display = 'block';
      else if (tabName === 'msg') document.getElementById('tabMsg').style.display = 'block';

      if (evt && evt.target) evt.target.classList.add('active');
    }

    async function loadOrders() {
      try {
        const res = await fetch('/api/orders');
        if (res.ok) {
          ordersData = await res.json();
        } else if (window.initialOrders) {
          ordersData = window.initialOrders;
        }
      } catch (e) {
        ordersData = window.initialOrders || [];
      }
      renderOrders();
    }

    function getNavUrls(loc, address, district) {
      let lat = null, lng = null;
      if (loc && typeof loc === 'string') {
        let matches = loc.match(/([0-9]+\.[0-9]+)/g);
        if (matches && matches.length >= 2) {
          let n1 = parseFloat(matches[0]), n2 = parseFloat(matches[1]);
          if (n1 >= 30 && n1 <= 45 && n2 >= 60 && n2 <= 75) { lat = n1; lng = n2; }
          else if (n2 >= 30 && n2 <= 45 && n1 >= 60 && n1 <= 75) { lat = n2; lng = n1; }
        }
      }
      if (lat && lng) {
        return {
          navi: `yandexnavi://build_route_on_map?lat_to=${lat}&lon_to=${lng}`,
          ymaps: `https://yandex.ru/maps/?rtext=~${lat},${lng}&rtt=auto`,
          isExact: true
        };
      }
      const full = `Самарканд ${district || ''} ${address || ''}`.trim();
      const enc = encodeURIComponent(full);
      return {
        navi: `yandexnavi://build_route_on_map?lat_to=&lon_to=&text=${enc}`,
        ymaps: `https://yandex.ru/maps/?text=${enc}`,
        isExact: false
      };
    }

    function renderOrders() {
      const q = (document.getElementById('searchQuery')?.value || '').toLowerCase().trim();
      const container = document.getElementById('ordersList');

      let filtered = ordersData;
      if (q) {
        filtered = ordersData.filter(o => 
          (o.ID || '').toString().toLowerCase().includes(q) ||
          (o.Клиент || '').toLowerCase().includes(q) ||
          (o.Телефон || '').toLowerCase().includes(q) ||
          (o.Адрес || '').toLowerCase().includes(q) ||
          (o.Размеры || '').toLowerCase().includes(q)
        );
      }

      if (!filtered || filtered.length === 0) {
        container.innerHTML = '<div class="empty-msg">📭 Нет заказов</div>';
        return;
      }

      container.innerHTML = filtered.map(o => {
        const nav = getNavUrls(o.Локация, o.Адрес, o.Район);
        const comment = o.Размеры || o.Примечание || o.Izoh || 'Нет комментария';
        
        const courierSelect = courierOptions.map(c => 
          `<option value="${c}" ${(o.Курьер || '').includes(c) ? 'selected' : ''}>${c}</option>`
        ).join('');

        return `
        <div class="order-card">
          <div class="order-header">
            <span class="order-badge">📦 № ${o.ID}</span>
            <span class="order-status">${o.Статус || 'Забор'}</span>
          </div>
          <div class="client-name">👤 ${o.Клиент || 'Клиент'}</div>
          <a href="tel:${o.Телефон}" class="client-phone">📞 ${o.Телефон || '-'}</a>
          <div class="order-addr">🏠 <b>${o.Район || 'Самарканд'}</b>, ${o.Адрес || '-'}</div>
          
          <!-- КОММЕНТАРИЙ ДЛЯ КУРЬЕРОВ -->
          <div class="order-comment">
            💬 <b>Комментарий для курьера:</b><br>${comment}
            ${nav.isExact ? '<span style="color:#10b981; font-weight:bold;"><br>📍 (GPS координаты сохранены)</span>' : ''}
          </div>

          <div style="margin-bottom: 12px; display:flex; align-items:center; gap:6px;">
            <span style="color:var(--accent-yellow); font-weight:700; font-size:12px;">🚚 Курьер:</span>
            <select class="form-select" style="padding:4px 8px; font-size:12px; flex:1;" onchange="reassignCourier('${o.ID}', this.value)">
              ${courierSelect}
            </select>
          </div>

          <div style="display:flex; gap:6px;">
            <a href="${nav.navi}" class="btn-nav" style="flex:1;">🧭 Навигатор</a>
            <a href="${nav.ymaps}" target="_blank" class="btn-nav" style="flex:1; background:rgba(59, 130, 246, 0.2);">🗺️ Я.Карты</a>
          </div>
        </div>
        `;
      }).join('');
    }

    async function reassignCourier(orderId, newCourier) {
      try {
        const res = await fetch('/api/orders/update_status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId, courier: newCourier })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          alert('⚠️ Ошибка переназначения курьера: ' + (data.error || 'Ошибка сервера'));
          return;
        }
        ordersData.forEach(o => {
          if (String(o.ID) === String(orderId)) o.Курьер = newCourier;
        });
        renderOrders();
        alert(`🚚 Заказ №${orderId} переназначен курьеру ${newCourier}!`);
      } catch (e) {
        alert('⚠️ Ошибка связи с сервером: ' + e.message);
      }
    }

    async function handleCreateOrder(e) {
      e.preventDefault();
      const client = document.getElementById('newClient').value.trim();
      const phone = document.getElementById('newPhone').value.trim();
      const district = document.getElementById('newDistrict').value;
      const address = document.getElementById('newAddress').value.trim();
      const courier = document.getElementById('newCourier').value;
      const comment = document.getElementById('newComment').value.trim() || 'Забор ковров';

      try {
        const res = await fetch('/api/orders/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            client, phone, district, address, courier,
            items: comment, extraNote: comment,
            dispatcher: currentUser?.username || 'Диспетчер'
          })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          alert('⚠️ Ошибка создания заказа: ' + (data.error || 'Ошибка сервера'));
          return;
        }
        alert(`🎉 Заказ №${data.orderId || ''} принят и передан курьеру ${courier}!`);
        document.getElementById('newClient').value = '';
        document.getElementById('newPhone').value = '';
        document.getElementById('newAddress').value = '';
        document.getElementById('newComment').value = '';
        await loadOrders();
        switchTab('orders');
      } catch (err) {
        alert('⚠️ Ошибка связи с сервером: ' + err.message);
      }
    }

    async function handleSendBroadcast(e) {
      e.preventDefault();
      const targetCourier = document.getElementById('msgCourierTarget').value;
      const text = document.getElementById('msgText').value.trim();

      if (!text) {
        alert('⚠️ Введите текст сообщения!');
        return;
      }

      try {
        const res = await fetch('/api/notify_couriers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, courier: targetCourier, sender: currentUser?.username || 'Диспетчер' })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          alert('⚠️ Ошибка отправки сообщения: ' + (data.error || 'Ошибка сервера'));
          return;
        }
        alert('🚀 Сообщение успешно отправлено курьеру в Telegram!');
        document.getElementById('msgText').value = '';
      } catch (err) {
        alert('⚠️ Ошибка связи с сервером: ' + err.message);
      }
    }

    // Auto-polling for order updates every 10 seconds
    setInterval(loadOrders, 10000);
  </script>
</body>
</html>
